<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  
  <!-- Modern Phone Icon Mark -->
  <rect x="2" y="5" width="28" height="40" rx="6" fill="url(#logoGrad)"/>
  <rect x="5" y="9" width="22" height="28" rx="2" fill="#0f172a"/>
  <!-- Dynamic Island Notch -->
  <rect x="12" y="11" width="8" height="2.5" rx="1.2" fill="#ffffff" opacity="0.9"/>
  <!-- Home Indicator -->
  <rect x="11" y="34" width="10" height="1.5" rx="0.75" fill="#38bdf8"/>
  <!-- Signal Dots -->
  <circle cx="23" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Logo Typography -->
  <text x="40" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Phones<tspan fill="#0d9488">Daddy</tspan>
  </text>
  <text x="41" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.2">
    MOBILE SPECIFICATIONS
  </text>
</svg>
